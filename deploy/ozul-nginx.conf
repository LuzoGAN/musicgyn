# /etc/nginx/sites-enabled/flanelinha (SUBSTITUI o arquivo atual — faça backup antes!)
# Testar: sudo nginx -t && sudo systemctl reload nginx
#
# Como o TLS termina na Cloudflare (tunnel -> nginx:80), o esquema real vem
# no header X-Forwarded-Proto do cloudflared. O map abaixo (ir em
# /etc/nginx/nginx.conf, dentro do bloco http {}) garante o valor certo:
#
#   map $http_x_forwarded_proto $edge_proto {
#       default $http_x_forwarded_proto;
#       ""      "https";
#   }
#
server {
    listen 80;
    server_name 136.248.105.200;

    # ---------- GymBeats (NOVO) na raiz ----------
    location /static/ {
        alias /var/www/gymbeats/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_read_timeout 90s;
    }

    # ---------- Flanelinha (existente) em /flanelinha ----------
    location = /flanelinha { return 301 /flanelinha/; }

    location /flanelinha/static/ {
        alias /var/www/flanelinha/Flanelinha/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /flanelinha/ {
        include proxy_params;
        # a barra no final REMOVE o prefixo: /flanelinha/auth/login -> /auth/login
        proxy_pass http://unix:/var/www/flanelinha/flanelinha.sock:/;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        # avisa o Flask do prefixo p/ gerar URLs e redirects com /flanelinha/...
        proxy_set_header X-Script-Name /flanelinha;
        proxy_read_timeout 90s;
    }

    client_max_body_size 16M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
