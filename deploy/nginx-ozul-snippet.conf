# Trecho para o server {} do ozul.com.br no nginx do HOST
# (porta 443, dentro do bloco que já tem ssl_certificate).
# O GymBeats responde na raiz; cada projeto extra ganha um bloco igual
# ao do flanelinha, mudando só o final (/flanelinha, /proximo...).

# ---------- GymBeats (novo) na raiz ----------
location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}

# ---------- Flanelinha (existente) em /flanelinha ----------
location = /flanelinha { return 301 /flanelinha/; }

location /flanelinha/ {
    # a barra no final REMOVE o prefixo: /flanelinha/auth/login -> /auth/login
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # avisa o Flask do prefixo p/ gerar URLs e redirects com /flanelinha/...
    proxy_set_header X-Script-Name /flanelinha;
    proxy_read_timeout 90s;
}

